              class="inline-flex flex-wrap items-center gap-x-3 gap-y-1 transition-opacity duration-150 motion-reduce:transition-none"
            >
              <span aria-hidden="true" class="h-2 w-4 rounded-[2px] bg-(--iu-accent)"></span>
              <span>Slowest span: <span class="font-semibold">SELECT inventory</span></span>
              <span class="text-(--iu-muted) tabular-nums">413 ms · 49% of the request</span>
            </span>
            <span data-reading hidden class="text-(--iu-muted)">Reading 7 spans…</span>
            <span data-live aria-live="polite" class="sr-only"></span>
          </div>
        </figure>
      </div>
    </section>
    <!-- iloveui:component:end -->
    <script>
      (function () {
        var root = document.querySelector("[data-waterfall-hero]");
        if (!root) return;
        var SPANS = [
          {
            id: "s1",
            service: "gateway",
            name: "POST /api/checkout",
            depth: 0,
            start: 0,
            duration: 842,
            attributes: [
              ["http.method", "POST"],
              ["http.status_code", "200"],
              ["client.region", "eu-west-1"],
              ["user.plan", "growth"],
            ],
          },
          {
            id: "s2",
            service: "auth",
            name: "verify-session",
            depth: 1,
            start: 6,
            duration: 32,
            attributes: [
              ["auth.method", "jwt"],
              ["cache.hit", "true"],
            ],
          },
          {
            id: "s3",
            service: "cart",
            name: "load-cart",
            depth: 1,
            start: 40,
            duration: 82,
            attributes: [
              ["cart.items", "4"],
              ["redis.command", "HGETALL"],
            ],
          },
          {
            id: "s4",
            service: "pricing",
            name: "compute-tax",
            depth: 1,
            start: 124,
            duration: 72,
            attributes: [
              ["tax.country", "DE"],
              ["tax.rate", "0.19"],
            ],
          },
          {
            id: "s5",
            service: "postgres",
            name: "SELECT inventory",
            depth: 2,
            start: 198,
            duration: 413,
            attributes: [
              ["db.system", "postgresql"],
              ["db.statement", "SELECT sku, qty FROM inventory WHERE sku = ANY($1)"],
              ["db.rows_scanned", "12,482"],
              ["net.peer.name", "pg-primary-2"],
            ],
            insight: "Sequential scan over 12,482 rows. An index on inventory.sku brings this to about 9 ms.",
          },
          {
            id: "s6",
            service: "payments",
            name: "charge-card",
            depth: 1,
            start: 614,
            duration: 176,
            attributes: [
              ["payment.provider", "card"],
              ["payment.amount", "€184.20"],
              ["retry.count", "0"],
            ],
          },
          {
            id: "s7",
            service: "queue",
            name: "publish order.created",
            depth: 1,
            start: 792,
            duration: 38,
            attributes: [
              ["messaging.system", "nats"],
              ["messaging.destination", "orders"],
            ],
          },
        ];
        var TOTAL = 842;
        var CRITICAL = "s5";
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
        var options = Array.prototype.slice.call(root.querySelectorAll('[role="option"]'));
        var elapsed = root.querySelector("[data-elapsed]");
        var playhead = root.querySelector("[data-playhead]");
        var verdict = root.querySelector("[data-verdict]");
        var reading = root.querySelector("[data-reading]");
        var live = root.querySelector("[data-live]");
        var touched = false;
        var frame = null;
        var paused = false;
        var clock = TOTAL;
        var last = null;
        var delay = 0;

        function byId(id) {
          return SPANS.filter(function (span) {
            return span.id === id;
          })[0];
        }

        function renderDetail(span) {
          root.querySelector("[data-detail-service]").textContent = span.service;
          root.querySelector("[data-detail-name]").textContent = span.name;
          root.querySelector("[data-detail-start]").textContent = "+" + span.start + " ms";
          root.querySelector("[data-detail-duration]").textContent = span.duration + " ms";
          root.querySelector("[data-detail-share]").textContent = Math.round((span.duration / TOTAL) * 100) + "%";
          var list = root.querySelector("[data-detail-attributes]");
          while (list.firstChild) list.removeChild(list.firstChild);
          span.attributes.forEach(function (pair) {
            var row = document.createElement("div");
            row.className = "grid grid-cols-[minmax(0,7rem)_minmax(0,1fr)] gap-3";
            var dt = document.createElement("dt");
            dt.className = "truncate text-(--iu-muted)";
            dt.textContent = pair[0];
            var dd = document.createElement("dd");
            dd.className = "break-words";
            dd.textContent = pair[1];
            row.appendChild(dt);
            row.appendChild(dd);
            list.appendChild(row);
          });
          var insight = root.querySelector("[data-detail-insight]");
          insight.hidden = !span.insight;
          if (span.insight) root.querySelector("[data-detail-insight-text]").textContent = span.insight;
        }

        function select(index, focus) {
          var option = options[index];
          if (!option) return;
          options.forEach(function (other) {
            var selected = other === option;
            other.setAttribute("aria-selected", String(selected));
            other.tabIndex = selected ? 0 : -1;
            other.querySelector("[data-marker]").hidden = !selected;
          });
          renderDetail(byId(option.dataset.span));
          if (focus) option.focus();
        }

        function setCritical(on) {
          options.forEach(function (option) {
            var span = byId(option.dataset.span);
            var bar = option.querySelector("[data-bar]");
            var duration = option.querySelector("[data-duration]");
            var isCritical = on && span.id === CRITICAL;
            bar.classList.toggle("bg-(--iu-accent)", isCritical);
            bar.classList.toggle("bg-(--iu-foreground)/45", !isCritical && span.depth === 0);
            bar.classList.toggle("bg-(--iu-foreground)/25", !isCritical && span.depth !== 0);
            duration.classList.toggle("font-semibold", isCritical);
            duration.classList.toggle("text-(--iu-foreground)", isCritical);
            duration.classList.toggle("text-(--iu-muted)", !isCritical);
          });
        }

        function render(now) {
          elapsed.textContent = Math.round(now) + " ms";
          playhead.style.left = (now / TOTAL) * 100 + "%";
          options.forEach(function (option) {
            var span = byId(option.dataset.span);
            var scale = Math.min(1, Math.max(0, (now - span.start) / span.duration));
            option.querySelector("[data-bar]").style.scale = scale + " 1";
          });
        }

        function finish() {
          frame = null;
          render(TOTAL);
          playhead.hidden = true;
          verdict.hidden = false;
          reading.hidden = true;
          setCritical(true);
          if (!touched)
            select(
              options
                .map(function (o) {
                  return o.dataset.span;
                })
                .indexOf(CRITICAL),
              false,
            );
          live.textContent = "Slowest span is SELECT inventory, 413 milliseconds.";
        }

        function tick(time) {
          if (last === null) last = time;
          var step = time - last;
          last = time;
          if (!paused) {
            if (delay > 0) delay -= step;
            else clock = Math.min(TOTAL, clock + (step / 2400) * TOTAL);
          }
          render(clock);
          if (clock >= TOTAL) finish();
          else frame = requestAnimationFrame(tick);
        }

        function play() {
          if (frame !== null) cancelAnimationFrame(frame);
          if (reduce.matches) {
            finish();
            return;
          }
          clock = 0;
          last = null;
          delay = 300;
          playhead.hidden = false;
          verdict.hidden = true;
          reading.hidden = false;
          live.textContent = "";
          setCritical(false);
          if (!touched) select(0, false);
          render(0);
          frame = requestAnimationFrame(tick);
        }

        options.forEach(function (option, index) {
          option.addEventListener("click", function () {
            touched = true;
            select(index, false);
          });
          option.addEventListener("keydown", function (event) {
            var lastIndex = options.length - 1;
            var next = null;
            if (event.key === "ArrowDown") next = Math.min(lastIndex, index + 1);
            else if (event.key === "ArrowUp") next = Math.max(0, index - 1);
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = lastIndex;
            if (next === null) return;
            event.preventDefault();
            touched = true;
            select(next, true);
          });
        });

        root.querySelector("[data-replay]").addEventListener("click", function () {
          touched = false;
          play();
        });

        // Replay once the trace scrolls into view; pause while it is offscreen.
        var started = false;
        var observer = new IntersectionObserver(function (entries) {
          var entry = entries[0];
          if (!entry) return;
          paused = !entry.isIntersecting;
          if (entry.isIntersecting && !started) {
            started = true;
            play();
          }
        });
        observer.observe(root.querySelector("[data-trace]"));
      })();
    </script>
