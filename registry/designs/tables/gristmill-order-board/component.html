<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gristmill order board · iloveui</title>
    <!-- Tailwind CSS v4 in the browser so this file works on its own; in a project, use your Tailwind build. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      /* iloveui:tokens:start */
      :root {
        --iu-accent: #ff4d1f;
        --iu-accent-foreground: #111111;
        --iu-background: #fafafa;
        --iu-surface: #ffffff;
        --iu-border: #e4e4e7;
        --iu-foreground: #18181b;
        --iu-muted: #52525b;
        --iu-radius: 10px;
        --iu-font: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
        --iu-density: 1;
      }
      .dark {
        --iu-accent: #ff4d1f;
        --iu-accent-foreground: #111111;
        --iu-background: #09090b;
        --iu-surface: #18181b;
        --iu-border: #2e2e33;
        --iu-foreground: #fafafa;
        --iu-muted: #a1a1aa;
        --iu-radius: 10px;
        --iu-font: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
        --iu-density: 1;
      }
      /* iloveui:tokens:end */
    </style>
  </head>
  <body class="bg-(--iu-background) font-(family-name:--iu-font) text-(--iu-foreground)">
    <div class="mx-auto w-full max-w-5xl px-4 py-10 sm:px-8 sm:py-16">
      <!-- iloveui:component:start -->
      <section
        data-gristmill
        aria-labelledby="gristmill-title"
        class="@container rounded-[min(var(--iu-radius),4px)] border-2 border-(--iu-foreground) bg-(--iu-surface) font-(family-name:--iu-font) text-(--iu-foreground) shadow-[6px_6px_0_var(--iu-foreground)]"
      >
        <header class="flex flex-wrap items-end justify-between gap-4 border-b-2 border-(--iu-foreground) p-4 @2xl:p-6">
          <div>
            <p class="font-mono text-[11px] font-bold tracking-[0.12em] uppercase">Gristmill Roasters · Wholesale</p>
            <h2
              id="gristmill-title"
              class="mt-1 text-[40px] leading-none font-extrabold tracking-[-0.04em] uppercase @2xl:text-[56px]"
            >
              Orders
            </h2>
          </div>
          <button
            type="button"
            class="inline-flex h-11 items-center justify-center gap-2 rounded-[min(var(--iu-radius),4px)] border-2 border-(--iu-foreground) bg-(--iu-accent) px-4 text-[13px] font-bold tracking-[0.04em] text-(--iu-accent-foreground) uppercase shadow-[3px_3px_0_var(--iu-foreground)] transition-[translate,box-shadow] duration-100 ease-linear focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--iu-accent) active:translate-x-[3px] active:translate-y-[3px] active:shadow-none motion-reduce:transition-none"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14"></path>
              <path d="M12 5v14"></path></svg
            >New order
          </button>
        </header>
        <dl data-stats class="grid grid-cols-2 border-b-2 border-(--iu-foreground) @2xl:grid-cols-4">
          <div class="flex flex-col gap-1 px-4 py-3 @2xl:px-6">
            <dt class="font-mono text-[11px] font-bold tracking-[0.1em] uppercase">Open orders</dt>
            <dd class="text-[28px] leading-none font-extrabold tracking-[-0.03em] tabular-nums">9</dd>
          </div>
          <div class="flex flex-col gap-1 border-l-2 border-(--iu-foreground) px-4 py-3 @2xl:px-6">
            <dt class="font-mono text-[11px] font-bold tracking-[0.1em] uppercase">Bags to roast</dt>
            <dd class="text-[28px] leading-none font-extrabold tracking-[-0.03em] tabular-nums">75</dd>
          </div>
          <div
            class="flex flex-col gap-1 border-t-2 border-(--iu-foreground) px-4 py-3 @2xl:border-t-0 @2xl:border-l-2 @2xl:px-6"
          >
            <dt class="font-mono text-[11px] font-bold tracking-[0.1em] uppercase">Ready to ship</dt>
            <dd class="text-[28px] leading-none font-extrabold tracking-[-0.03em] tabular-nums">3</dd>
          </div>
          <div
            class="flex flex-col gap-1 border-t-2 border-l-2 border-(--iu-foreground) px-4 py-3 @2xl:border-t-0 @2xl:px-6"
          >
            <dt class="font-mono text-[11px] font-bold tracking-[0.1em] uppercase">Open value</dt>
            <dd class="text-[28px] leading-none font-extrabold tracking-[-0.03em] tabular-nums">£1,462</dd>
          </div>
        </dl>
        <p data-announce aria-live="polite" class="sr-only"></p>
        <div class="hidden max-h-[452px] [scrollbar-gutter:stable] overflow-y-auto @3xl:block">
          <table class="w-full table-fixed border-separate border-spacing-0 text-left">
            <caption data-caption class="sr-only">
              Wholesale orders, sorted by Order descending
            </caption>
            <thead data-head></thead>
            <tbody data-body></tbody>
          </table>
        </div>
        <div class="@3xl:hidden">
          <div data-list-tools></div>
          <ul data-list></ul>
        </div>
        <div data-bulk></div>
        <nav
          aria-label="Order pages"
          class="flex items-center justify-between gap-3 border-t-2 border-(--iu-foreground) px-4 py-3 @2xl:px-6"
        >
          <p data-range class="font-mono text-[12px] font-bold tracking-[0.06em] uppercase tabular-nums">1–6 / 12</p>
          <div data-pages class="flex items-center gap-2"></div>
        </nav>
      </section>
      <!-- iloveui:component:end -->
    </div>
    <script>
      (function () {
        var root = document.querySelector("[data-gristmill]");
        if (!root) return;
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var PAGE_SIZE = 6;
        var STAGES = ["pending", "roasting", "packed", "shipped"];
        var STAGE_LABEL = { pending: "Pending", roasting: "Roasting", packed: "Packed", shipped: "Shipped" };
        var SORT_LABEL = { id: "Order", customer: "Customer", total: "Total", stage: "Stage" };
        var rows = [
          ["GM-1058", "Corner Bloom Café", "Leeds", "12 × 1kg Guji, 4 × 1kg Decaf", 16, 41300, "pending"],
          ["GM-1057", "Haverford Bakery", "York", "6 × 1kg House Espresso", 6, 13700, "roasting"],
          ["GM-1056", "Slow Lane Cycles", "Hebden Bridge", "3 × 250g Huila, 3 × 250g Guji", 6, 5000, "packed"],
          ["GM-1055", "The Reading Room", "Harrogate", "20 × 1kg House Espresso", 20, 45800, "shipped"],
          ["GM-1054", "Pell & Daughters", "Sheffield", "8 × 1kg Cerrado", 8, 17900, "roasting"],
          ["GM-1053", "Tinker Street Deli", "Manchester", "4 × 1kg Decaf", 4, 10000, "pending"],
          ["GM-1052", "Northgate Climbing", "Leeds", "10 × 1kg House Espresso", 10, 22900, "packed"],
          ["GM-1051", "Fold Studio", "Bradford", "2 × 1kg Guji, 2 × 1kg Huila", 4, 11200, "shipped"],
          ["GM-1050", "Marram Hotel", "Whitby", "24 × 1kg House Espresso", 24, 55000, "shipped"],
          ["GM-1049", "Kiln & Kettle", "Halifax", "6 × 1kg Cerrado, 2 × 1kg Decaf", 8, 18400, "pending"],
          ["GM-1048", "Uptown Laundrette", "Leeds", "2 × 1kg House Espresso", 2, 4600, "packed"],
          ["GM-1047", "Wold Farm Shop", "Malton", "15 × 250g Guji", 15, 12400, "roasting"],
        ].map(function (r) {
          return { id: r[0], customer: r[1], city: r[2], items: r[3], bags: r[4], total: r[5], stage: r[6] };
        });
        var state = { sort: { key: "id", direction: "desc" }, page: 1, selected: new Set() };
        var money = new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 0 });
        var focusRing = "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--iu-accent)";
        var block =
          "inline-flex items-center justify-center gap-2 rounded-[min(var(--iu-radius),4px)] border-2 border-(--iu-foreground) font-bold tracking-[0.04em] uppercase";
        var td = "border-b-2 border-(--iu-foreground)/15 px-3 py-[calc(12px*var(--iu-density))] align-middle";
        var th =
          "sticky top-0 z-10 border-b-2 border-(--iu-foreground) bg-(--iu-background) px-3 py-2 text-left font-mono text-[11px] text-(--iu-foreground)";
        var P = {
          up: '<path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path>',
          down: '<path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path>',
          left: '<path d="m15 18-6-6 6-6"></path>',
          right: '<path d="m9 18 6-6-6-6"></path>',
          advance: '<path d="m6 17 5-5-5-5"></path><path d="m13 17 5-5-5-5"></path>',
          printer:
            '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"></path><rect x="6" y="14" width="12" height="8" rx="1"></rect>',
          x: '<path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>',
        };
        function svg(name, size, stroke) {
          return (
            '<svg aria-hidden="true" width="' +
            size +
            '" height="' +
            size +
            '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
            stroke +
            '" stroke-linecap="round" stroke-linejoin="round">' +
            P[name] +
            "</svg>"
          );
        }
        function esc(t) {
          return String(t).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }
        function fmt(minor) {
          return money.format(minor / 100);
        }
        function check(key, label, checked, mixed) {
          return (
            '<label class="relative inline-flex size-6 cursor-pointer items-center justify-center pointer-coarse:size-10"><input type="checkbox" data-key="' +
            key +
            '"' +
            (checked ? " checked" : "") +
            ' aria-label="' +
            esc(label) +
            '" class="peer sr-only" />' +
            '<span aria-hidden="true" class="flex size-5 items-center justify-center border-2 border-(--iu-foreground) peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-(--iu-accent) ' +
            (checked || mixed ? "bg-(--iu-foreground) text-(--iu-surface)" : "bg-(--iu-surface)") +
            '">' +
            (checked
              ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.5 4.8 9 10 3" stroke="currentColor" stroke-width="2.25" stroke-linecap="square"></path></svg>'
              : mixed
                ? '<span class="h-0.5 w-2.5 bg-current"></span>'
                : "") +
            "</span></label>"
          );
        }
        function rail(order, scope) {
          var current = STAGES.indexOf(order.stage);
          return (
            '<fieldset class="min-w-0"><legend class="sr-only">Stage for ' +
            order.id +
            ", " +
            esc(order.customer) +
            '</legend><div class="flex items-center gap-1">' +
            STAGES.map(function (stage, index) {
              return (
                '<label class="relative block cursor-pointer" title="' +
                STAGE_LABEL[stage] +
                '"><input type="radio" class="peer sr-only" data-key="stage-' +
                scope +
                "-" +
                order.id +
                "-" +
                stage +
                '" data-order="' +
                order.id +
                '" name="stage-' +
                scope +
                "-" +
                order.id +
                '" value="' +
                stage +
                '"' +
                (order.stage === stage ? " checked" : "") +
                " />" +
                '<span class="sr-only">' +
                STAGE_LABEL[stage] +
                "</span>" +
                '<span aria-hidden="true" class="relative block h-6 w-6 overflow-hidden border-2 border-(--iu-foreground) bg-(--iu-surface) peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-(--iu-accent) @4xl:w-7 pointer-coarse:h-10 pointer-coarse:w-8 pointer-fine:peer-hover:bg-(--iu-foreground)/15">' +
                '<span data-fill="' +
                index +
                '" class="absolute inset-0 origin-left bg-(--iu-foreground)" style="transform: scaleX(' +
                (index <= current ? 1 : 0) +
                ')"></span></span></label>'
              );
            }).join("") +
            "</div></fieldset>"
          );
        }
        function sticker(stage) {
          var tone =
            stage === "shipped"
              ? "-rotate-3 bg-(--iu-foreground) text-(--iu-surface)"
              : stage === "pending"
                ? "border-dashed text-(--iu-foreground)"
                : "bg-(--iu-surface) text-(--iu-foreground)";
          return (
            '<span data-sticker class="inline-flex h-6 items-center border-2 border-(--iu-foreground) px-1.5 font-mono text-[11px] font-bold tracking-[0.06em] uppercase ' +
            tone +
            '">' +
            STAGE_LABEL[stage] +
            "</span>"
          );
        }
        function sortButton(key) {
          var active = state.sort.key === key;
          return (
            '<button type="button" data-key="sort-' +
            key +
            '" data-sort="' +
            key +
            '" class="-mx-1 inline-flex h-7 items-center gap-1 px-1 font-bold tracking-[0.08em] uppercase pointer-coarse:h-10 pointer-fine:hover:bg-(--iu-foreground) pointer-fine:hover:text-(--iu-background) ' +
            focusRing +
            '">' +
            SORT_LABEL[key] +
            (active ? svg(state.sort.direction === "asc" ? "up" : "down", 14, 2.5) : "") +
            "</button>"
          );
        }
        function ariaSort(key) {
          return state.sort.key === key
            ? ' aria-sort="' + (state.sort.direction === "asc" ? "ascending" : "descending") + '"'
            : "";
        }
        function sorted() {
          var f = state.sort.direction === "asc" ? 1 : -1,
            k = state.sort.key;
          return rows.slice().sort(function (a, b) {
            if (k === "total") return (a.total - b.total) * f;
            if (k === "customer") return a.customer.localeCompare(b.customer) * f;
            if (k === "stage") return (STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage)) * f;
            return a.id.localeCompare(b.id, undefined, { numeric: true }) * f;
          });
        }
        function announce(text) {
          root.querySelector("[data-announce]").textContent = text;
        }

        function render(stamped) {
          var focusKey = document.activeElement && document.activeElement.getAttribute("data-key");
          var list = sorted();
          var pageCount = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
          if (state.page > pageCount) state.page = pageCount;
          var pageRows = list.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
          var pageIds = pageRows.map(function (r) {
            return r.id;
          });
          var onPage = pageIds.filter(function (id) {
            return state.selected.has(id);
          }).length;
          var allOn = onPage > 0 && onPage === pageIds.length;
          var mixed = onPage > 0 && onPage < pageIds.length;

          var open = rows.filter(function (r) {
            return r.stage !== "shipped";
          });
          var values = [
            String(open.length),
            String(
              open.reduce(function (s, r) {
                return s + r.bags;
              }, 0),
            ),
            String(
              rows.filter(function (r) {
                return r.stage === "packed";
              }).length,
            ),
            fmt(
              open.reduce(function (s, r) {
                return s + r.total;
              }, 0),
            ),
          ];
          root.querySelectorAll("[data-stats] dd").forEach(function (dd, i) {
            dd.textContent = values[i];
          });

          root.querySelector("[data-caption]").textContent =
            "Wholesale orders, sorted by " +
            SORT_LABEL[state.sort.key] +
            " " +
            (state.sort.direction === "asc" ? "ascending" : "descending");
          root.querySelector("[data-head]").innerHTML =
            '<tr><th scope="col" class="' +
            th +
            ' w-14 pl-5">' +
            check("page-wide", "Select every order on this page", allOn, mixed) +
            '</th><th scope="col"' +
            ariaSort("id") +
            ' class="' +
            th +
            ' w-[112px]">' +
            sortButton("id") +
            '</th><th scope="col"' +
            ariaSort("customer") +
            ' class="' +
            th +
            '">' +
            sortButton("customer") +
            '</th><th scope="col"' +
            ariaSort("total") +
            ' class="' +
            th +
            ' w-[104px] text-right">' +
            sortButton("total") +
            '</th><th scope="col"' +
            ariaSort("stage") +
            ' class="' +
            th +
            ' w-[264px] pr-5">' +
            sortButton("stage") +
            "</th></tr>";

          root.querySelector("[data-body]").innerHTML = pageRows
            .map(function (o) {
              var sel = state.selected.has(o.id);
              return (
                '<tr data-row="' +
                o.id +
                '" class="' +
                (sel ? "bg-(--iu-foreground)/8" : "") +
                '"><td class="' +
                td +
                " relative pl-5 " +
                (sel ? "shadow-[inset_6px_0_0_var(--iu-foreground)]" : "") +
                '">' +
                check("row-wide-" + o.id, "Select " + o.id + ", " + o.customer, sel) +
                '</td><td class="' +
                td +
                ' font-mono text-[13px] font-bold tabular-nums">' +
                o.id +
                '</td><td class="' +
                td +
                '"><span class="block truncate text-[15px] font-bold">' +
                esc(o.customer) +
                '<span class="font-normal text-(--iu-muted)"> · ' +
                esc(o.city) +
                '</span></span><span class="mt-0.5 block truncate font-mono text-[12px] text-(--iu-muted)">' +
                esc(o.items) +
                '</span></td><td class="' +
                td +
                ' text-right text-[15px] font-bold tabular-nums">' +
                fmt(o.total) +
                '</td><td class="' +
                td +
                ' pr-5"><span class="flex items-center gap-3">' +
                rail(o, "wide") +
                sticker(o.stage) +
                "</span></td></tr>"
              );
            })
            .join("");

          root.querySelector("[data-list-tools]").innerHTML =
            '<div class="flex items-center gap-2 border-b-2 border-(--iu-foreground) bg-(--iu-background) px-4 py-2 font-mono text-[11px] font-bold tracking-[0.08em] uppercase">' +
            check("page-narrow", "Select every order on this page", allOn, mixed) +
            '<span aria-hidden="true" class="mr-auto">Page</span><span>Sort</span><span>' +
            sortButton("id") +
            "</span><span>" +
            sortButton("total") +
            "</span><span>" +
            sortButton("stage") +
            "</span></div>";
          root.querySelector("[data-list]").innerHTML = pageRows
            .map(function (o) {
              var sel = state.selected.has(o.id);
              return (
                '<li data-row="' +
                o.id +
                '" class="border-b-2 border-(--iu-foreground)/15 p-4 ' +
                (sel ? "bg-(--iu-foreground)/8 shadow-[inset_6px_0_0_var(--iu-foreground)]" : "") +
                '"><div class="flex items-start gap-3">' +
                check("row-narrow-" + o.id, "Select " + o.id + ", " + o.customer, sel) +
                '<div class="min-w-0 flex-1"><div class="flex items-baseline justify-between gap-3"><span class="font-mono text-[12px] font-bold tabular-nums">' +
                o.id +
                '</span><span class="text-[15px] font-bold tabular-nums">' +
                fmt(o.total) +
                '</span></div><p class="mt-1 text-[15px] font-bold">' +
                esc(o.customer) +
                '<span class="font-normal text-(--iu-muted)"> · ' +
                esc(o.city) +
                '</span></p><p class="mt-0.5 font-mono text-[12px] text-(--iu-muted)">' +
                esc(o.items) +
                '</p><div class="mt-3 flex items-center gap-3">' +
                rail(o, "narrow") +
                sticker(o.stage) +
                "</div></div></div></li>"
              );
            })
            .join("");

          var chosen = rows.filter(function (r) {
            return state.selected.has(r.id);
          });
          var advanceable = chosen.filter(function (r) {
            return r.stage !== "shipped";
          });
          root.querySelector("[data-bulk]").innerHTML = chosen.length
            ? '<div class="flex flex-wrap items-center gap-3 border-t-2 border-(--iu-foreground) bg-(--iu-foreground) px-4 py-3 text-(--iu-background) @2xl:px-6"><p class="mr-auto font-mono text-[12px] font-bold tracking-[0.08em] uppercase"><span class="text-[20px] tabular-nums">' +
              chosen.length +
              "</span> " +
              (chosen.length === 1 ? "order" : "orders") +
              ' · <span class="tabular-nums">' +
              fmt(
                chosen.reduce(function (s, r) {
                  return s + r.total;
                }, 0),
              ) +
              "</span></p>" +
              '<button type="button" data-key="advance" data-act="advance"' +
              (advanceable.length ? "" : " disabled") +
              ' class="' +
              block +
              " h-10 border-(--iu-background) bg-(--iu-background) px-3 text-[12px] text-(--iu-foreground) shadow-[3px_3px_0_var(--iu-accent)] transition-[translate,box-shadow] duration-100 ease-linear disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none active:translate-x-[3px] active:translate-y-[3px] active:shadow-none " +
              focusRing +
              '">' +
              svg("advance", 16, 2.5) +
              "Advance stage</button>" +
              '<button type="button" data-key="labels" data-act="labels" class="' +
              block +
              " h-10 border-(--iu-background) px-3 text-[12px] text-(--iu-background) pointer-fine:hover:bg-(--iu-background)/15 " +
              focusRing +
              '">' +
              svg("printer", 16, 2) +
              "Labels</button>" +
              '<button type="button" data-key="clear" data-act="clear" aria-label="Clear selection" class="' +
              block +
              " size-10 border-(--iu-background) text-(--iu-background) pointer-fine:hover:bg-(--iu-background)/15 " +
              focusRing +
              '">' +
              svg("x", 18, 2.5) +
              "</button></div>"
            : "";

          root.querySelector("[data-range]").textContent =
            (state.page - 1) * PAGE_SIZE +
            1 +
            "–" +
            Math.min(state.page * PAGE_SIZE, list.length) +
            " / " +
            list.length;
          var nav =
            "inline-flex items-center justify-center gap-2 rounded-[min(var(--iu-radius),4px)] border-2 border-(--iu-foreground) font-bold tracking-[0.04em] uppercase size-9 disabled:cursor-not-allowed disabled:border-(--iu-foreground)/30 disabled:text-(--iu-muted) pointer-coarse:size-10 " +
            focusRing;
          var pages =
            '<button type="button" data-key="prev" data-page="prev" aria-label="Previous page"' +
            (state.page <= 1 ? " disabled" : "") +
            ' class="' +
            nav +
            '">' +
            svg("left", 18, 2.5) +
            "</button>";
          for (var n = 1; n <= pageCount; n++) {
            var cur = n === state.page;
            pages +=
              '<button type="button" data-key="page-' +
              n +
              '" data-page="' +
              n +
              '" aria-label="Page ' +
              n +
              '"' +
              (cur ? ' aria-current="page"' : "") +
              ' class="' +
              block +
              " size-9 font-mono text-[14px] disabled:cursor-not-allowed pointer-coarse:size-10 " +
              (cur ? "bg-(--iu-foreground) text-(--iu-background)" : "pointer-fine:hover:bg-(--iu-foreground)/10") +
              " " +
              focusRing +
              '">' +
              n +
              "</button>";
          }
          pages +=
            '<button type="button" data-key="next" data-page="next" aria-label="Next page"' +
            (state.page >= pageCount ? " disabled" : "") +
            ' class="' +
            nav +
            '">' +
            svg("right", 18, 2.5) +
            "</button>";
          root.querySelector("[data-pages]").innerHTML = pages;

          // Stamp: the newly filled segments slam in left to right and the sticker lands.
          if (stamped && !reduce) {
            root.querySelectorAll('[data-row="' + stamped.id + '"]').forEach(function (row) {
              row.querySelectorAll("[data-fill]").forEach(function (fill) {
                var i = Number(fill.getAttribute("data-fill"));
                if (i > stamped.from && i <= STAGES.indexOf(stamped.to)) {
                  fill.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], {
                    duration: 100,
                    easing: "linear",
                    delay: i * 40,
                    fill: "backwards",
                  });
                }
              });
              var s = row.querySelector("[data-sticker]");
              if (s)
                s.animate([{ transform: "scale(1.25) rotate(-8deg)", opacity: 0 }, { opacity: 1 }], {
                  duration: 120,
                  easing: "linear",
                });
            });
          }
          if (focusKey) {
            var again = root.querySelector('[data-key="' + focusKey + '"]');
            if (again) again.focus();
          }
          root._pageIds = pageIds;
        }

        root.addEventListener("change", function (event) {
          var t = event.target;
          var key = t.getAttribute("data-key") || "";
          if (t.type === "radio") {
            var order = rows.filter(function (r) {
              return r.id === t.getAttribute("data-order");
            })[0];
            var from = STAGES.indexOf(order.stage);
            order.stage = t.value;
            announce(order.id + " moved to " + STAGE_LABEL[order.stage]);
            render({ id: order.id, from: from, to: order.stage });
            return;
          }
          if (key.indexOf("page-") === 0) {
            var ids = root._pageIds || [];
            var all = ids.every(function (id) {
              return state.selected.has(id);
            });
            ids.forEach(function (id) {
              if (all) state.selected.delete(id);
              else state.selected.add(id);
            });
          } else if (key.indexOf("row-") === 0) {
            var id = key.replace(/^row-(wide|narrow)-/, "");
            if (state.selected.has(id)) state.selected.delete(id);
            else state.selected.add(id);
          } else return;
          render(null);
        });
        root.addEventListener("click", function (event) {
          var b = event.target.closest("button");
          if (!b || !root.contains(b)) return;
          if (b.hasAttribute("data-sort")) {
            var k = b.getAttribute("data-sort");
            state.sort =
              state.sort.key === k
                ? { key: k, direction: state.sort.direction === "asc" ? "desc" : "asc" }
                : { key: k, direction: k === "customer" ? "asc" : "desc" };
            state.page = 1;
          } else if (b.hasAttribute("data-page")) {
            var p = b.getAttribute("data-page");
            state.page = p === "prev" ? state.page - 1 : p === "next" ? state.page + 1 : Number(p);
          } else if (b.hasAttribute("data-act")) {
            var act = b.getAttribute("data-act");
            if (act === "clear") state.selected.clear();
            if (act === "labels") announce("Labels sent to the printer for " + state.selected.size + " orders");
            if (act === "advance") {
              var moved = 0;
              rows.forEach(function (r) {
                if (state.selected.has(r.id) && r.stage !== "shipped") {
                  r.stage = STAGES[STAGES.indexOf(r.stage) + 1];
                  moved++;
                }
              });
              announce(moved + (moved === 1 ? " order" : " orders") + " moved one stage forward");
            }
          } else return;
          render(null);
        });
        render(null);
      })();
    </script>
  </body>
</html>
