          var count = cart.reduce(function (s, l) {
            return s + l.qty;
          }, 0);
          var badge = root.querySelector("[data-badge]");
          badge.textContent = count;
          root.querySelector("[data-badge-sr]").textContent = ", " + count + (count === 1 ? " item" : " items");
          if (!reduce) {
            badge.style.animation = "none";
            void badge.offsetWidth;
            badge.style.animation = "sock-bump 360ms cubic-bezier(0.3,1.4,0.5,1)";
          }
        }

        function addLine(p, state, card) {
          var existing = cart.filter(function (l) {
            return key(l) === p.id + ":" + state.pattern + ":" + state.size;
          })[0];
          if (existing) existing.qty = Math.min(existing.qty + 1, p.stock[state.size]);
          else cart.push({ productId: p.id, pattern: state.pattern, size: state.size, qty: 1 });
          placed = false;
          announce(p.name + ", " + LABEL[state.pattern] + ", size " + state.size + " added to your cart.");
          refreshCards();
          renderCart();
          var from = card.querySelector("[data-plate]").getBoundingClientRect();
          var to = cartButton.getBoundingClientRect();
          if (reduce) {
            bumpBadge();
            return;
          }
          var flyer = document.createElement("div");
          flyer.setAttribute("aria-hidden", "true");
          flyer.className = "pointer-events-none fixed z-[70] size-14";
          var x = from.left + from.width / 2 - 28,
            y = from.top + from.height / 2 - 28;
          var dx = to.left + to.width / 2 - 28 - x,
            dy = to.top + to.height / 2 - 28 - y;
          flyer.style.left = x + "px";
          flyer.style.top = y + "px";
          flyer.innerHTML = sock(state.pattern, "size-full");
          root.appendChild(flyer);
          var flight = flyer.animate(
            [
              { transform: "translate(0,0) scale(1) rotate(-10deg)" },
              {
                transform: "translate(" + dx * 0.5 + "px," + (Math.min(dy, 0) - 90) + "px) scale(0.9) rotate(20deg)",
                offset: 0.4,
              },
              { transform: "translate(" + dx + "px," + dy + "px) scale(0.35) rotate(40deg)" },
            ],
            { duration: 620, easing: "ease-in-out" },
          );
          flight.onfinish = function () {
            root.removeChild(flyer);
            bumpBadge();
          };
        }

        /* ---------------- cart */
        function totals() {
          var subtotal = 0,
            sale = 0;
          cart.forEach(function (l) {
            var p = product(l.productId);
            subtotal += p.price * l.qty;
            if (p.compareAt) sale += (p.compareAt - p.price) * l.qty;
          });
          var off = code ? Math.round(subtotal * 0.15) : 0;
          var after = subtotal - off;
          var shipping = after >= FREE_FROM || !cart.length ? 0 : FEE;
          return {
            subtotal: subtotal,
            sale: sale,
            off: off,
            after: after,
            shipping: shipping,
            total: after + shipping,
          };
        }

        function row(label, value) {
          return (
            '<div class="flex justify-between gap-4"><dt class="text-(--iu-muted)">' +
            label +
            '</dt><dd class="font-bold">' +
            value +
            "</dd></div>"
          );
        }

        function renderCart() {
          var body = root.querySelector("[data-cart-body]");
          var count = cart.reduce(function (s, l) {
            return s + l.qty;
          }, 0);
          root.querySelector("[data-title]").textContent = placed ? "Order placed" : "Your cart";
          root.querySelector("[data-title-count]").textContent = placed ? "" : count;
          if (placed) {
            body.innerHTML =
              '<div class="flex flex-1 flex-col items-center justify-center gap-4 px-6 py-10 text-center">' +
              '<svg aria-hidden="true" viewBox="0 0 160 120" class="w-44"><circle cx="80" cy="62" r="44" class="fill-(--sp-tint) stroke-(--sp-ink)" stroke-width="3"/><path d="M60 63l14 14 28-30" class="fill-none stroke-(--sp-ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="20" width="12" height="12" rx="3" transform="rotate(20 24 26)" class="fill-(--iu-accent)"/><circle cx="136" cy="30" r="6" class="fill-(--iu-accent)"/><path d="M128 96l10 6M22 92l-8 8" class="stroke-(--sp-ink)" stroke-width="3" stroke-linecap="round"/></svg>' +
              '<p class="text-2xl font-extrabold tracking-[-0.03em]">Your socks are on the way.</p><p class="max-w-[18rem] text-sm text-pretty text-(--iu-muted)">Order <span class="font-mono font-semibold text-(--iu-foreground)">SP-20418</span> ships tomorrow. A receipt is on its way to your inbox.</p>' +
              '<button type="button" data-dismiss class="' +
              SECONDARY +
              '">Keep browsing</button></div>';
            body.querySelector("[data-dismiss]").addEventListener("click", close);
            return;
          }
          if (!cart.length) {
            body.innerHTML =
              '<div class="flex flex-1 flex-col items-center justify-center gap-3 px-6 py-12 text-center">' +
              '<svg aria-hidden="true" viewBox="0 0 160 110" class="w-40"><path d="M20 96h120" class="stroke-(--sp-ink)" stroke-width="3" stroke-linecap="round"/><path d="M46 44h68l-8 52H54Z" class="fill-(--sp-tint) stroke-(--sp-ink)" stroke-width="3" stroke-linejoin="round"/><path d="M62 44c0-14 8-22 18-22s18 8 18 22" class="fill-none stroke-(--sp-ink)" stroke-width="3" stroke-linecap="round"/><circle cx="68" cy="66" r="3" class="fill-(--sp-ink)"/><circle cx="92" cy="66" r="3" class="fill-(--sp-ink)"/><path d="M70 80c6-4 14-4 20 0" class="fill-none stroke-(--sp-ink)" stroke-width="3" stroke-linecap="round"/></svg>' +
              '<p class="text-lg font-extrabold">Your cart is sock-free.</p><p class="max-w-[17rem] text-sm text-pretty text-(--iu-muted)">Pick a pattern and a size, then add a pair. Everything ships tomorrow.</p>' +
              '<button type="button" data-dismiss class="' +
              PRIMARY +
              '">Browse the drop</button></div>';
            body.querySelector("[data-dismiss]").addEventListener("click", close);
            return;
          }
          var t = totals();
          var toFree = Math.max(0, FREE_FROM - t.after);
          body.innerHTML =
            '<div class="flex-1 overflow-y-auto px-5 [scrollbar-gutter:stable] sm:px-6">' +
            '<div class="mt-4 rounded-[max(var(--iu-radius),18px)] border-2 border-(--sp-ink) bg-(--sp-tint) p-3"><p class="flex items-center gap-2 text-[13px] font-bold">' +
            (toFree > 0 ? gbp(toFree) + " away from free shipping" : "Free shipping unlocked") +
            "</p>" +
            '<div role="progressbar" aria-label="Progress to free shipping" aria-valuemin="0" aria-valuemax="' +
            FREE_FROM +
            '" aria-valuenow="' +
            Math.min(t.after, FREE_FROM) +
            '" aria-valuetext="' +
            (toFree > 0 ? gbp(toFree) + " to go" : "Unlocked") +
            '" class="mt-2 h-3 overflow-hidden rounded-full border-2 border-(--sp-ink) bg-(--iu-surface)"><div class="h-full origin-left bg-(--iu-accent) transition-transform duration-300 motion-reduce:transition-none" style="transform:scaleX(' +
            Math.min(1, t.after / FREE_FROM) +
            ')"></div></div></div>' +
            '<ul class="divide-y-2 divide-dashed divide-(--iu-foreground)/15">' +
            cart
              .map(function (l, i) {
                var p = product(l.productId),
                  max = p.stock[l.size];
                return (
                  '<li class="flex gap-3 py-[calc(14px*var(--iu-density))]"><span class="grid size-16 shrink-0 place-items-center rounded-[max(var(--iu-radius),16px)] border-2 border-(--sp-ink) bg-(--sp-tint)">' +
                  sock(l.pattern, "size-12 -rotate-6") +
                  "</span>" +
                  '<div class="min-w-0 flex-1"><div class="flex items-start justify-between gap-2"><p class="truncate text-sm font-extrabold">' +
                  p.name +
                  '</p><p class="shrink-0 text-sm font-extrabold tabular-nums">' +
                  gbp(p.price * l.qty) +
                  "</p></div>" +
                  '<p class="text-[12px] text-(--iu-muted)">' +
                  LABEL[l.pattern] +
                  " · Size " +
                  l.size +
                  (p.compareAt
                    ? '<span class="ml-1.5 font-bold text-(--iu-foreground)">Sale −' +
                      gbp((p.compareAt - p.price) * l.qty) +
                      "</span>"
                    : "") +
                  "</p>" +
                  '<div class="mt-2 flex items-center justify-between gap-2"><div role="group" aria-label="Quantity of ' +
                  p.name +
                  '" class="flex items-center gap-2">' +
                  '<button type="button" data-minus="' +
                  i +
                  '" aria-label="' +
                  (l.qty === 1 ? "Remove " + p.name : "One fewer " + p.name) +
                  '" class="' +
                  ICON_BUTTON +
                  '"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg></button>' +
                  '<span class="w-6 text-center text-sm font-extrabold tabular-nums">' +
                  l.qty +
                  "</span>" +
                  '<button type="button" data-plus="' +
                  i +
                  '"' +
                  (l.qty >= max ? " disabled" : "") +
                  ' aria-label="One more ' +
                  p.name +
                  '" class="' +
                  ICON_BUTTON +
                  '"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>' +
                  (l.qty >= max
                    ? '<span class="text-[12px] font-semibold text-(--iu-muted)">Max ' + max + "</span>"
                    : "") +
                  "</div>" +
                  '<button type="button" data-remove="' +
                  i +
                  '" aria-label="Remove ' +
                  p.name +
                  ' from cart" class="grid size-8 place-items-center rounded-full text-(--iu-muted) pointer-fine:hover:bg-(--iu-foreground)/8 pointer-fine:hover:text-(--iu-foreground) pointer-coarse:size-10 ' +
                  FOCUS +
                  '"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button></div></div></li>'
                );
              })
              .join("") +
            "</ul>" +
            '<div class="border-t-2 border-dashed border-(--iu-foreground)/15 py-4">' +
            (code
              ? '<div class="flex items-center justify-between gap-3 rounded-full border-2 border-(--sp-ink) bg-(--sp-tint) py-1 pr-1 pl-3"><span class="inline-flex items-center gap-2 text-sm font-extrabold">' +
                code +
                ' <span class="font-semibold text-(--iu-muted)">15% off</span></span><button type="button" data-code-remove class="h-8 rounded-full px-3 text-[13px] font-bold pointer-fine:hover:bg-(--iu-foreground)/8 pointer-coarse:h-10 ' +
                FOCUS +
                '">Remove</button></div>'
              : '<form data-code-form novalidate><label for="sock-code" class="mb-1.5 block text-[13px] font-bold">Discount code</label><div class="flex gap-2"><input id="sock-code" autocomplete="off" placeholder="Enter a code"' +
                (codeError ? ' aria-invalid="true" aria-describedby="sock-code-error"' : "") +
                ' class="h-11 min-w-0 flex-1 rounded-full border-2 bg-(--iu-surface) px-4 font-mono text-sm uppercase placeholder:text-(--iu-muted) placeholder:normal-case ' +
                (codeError ? "border-red-600 dark:border-red-400 " : "border-(--iu-foreground)/45 ") +
                FOCUS +
                '"/><button type="submit" class="' +
                SECONDARY +
                ' px-4">Apply</button></div>' +
                (codeError
                  ? '<p id="sock-code-error" class="mt-2 text-[13px] font-semibold text-red-700 dark:text-red-400">' +
                    codeError +
                    "</p>"
                  : "") +
                "</form>") +
            "</div></div>" +
            '<div class="border-t-2 border-(--sp-ink) px-5 pt-4 pb-[max(16px,env(safe-area-inset-bottom))] sm:px-6 sm:pb-6"><dl class="flex flex-col gap-1.5 text-sm tabular-nums">' +
            row("Subtotal", gbp(t.subtotal)) +
            (t.sale ? row("Sale savings (included)", "−" + gbp(t.sale)) : "") +
            (t.off ? row("Code " + code, "−" + gbp(t.off)) : "") +
            row("Shipping", t.shipping ? gbp(t.shipping) : "Free") +
            '<div class="mt-1 flex items-baseline justify-between gap-4 border-t-2 border-dashed border-(--iu-foreground)/15 pt-2"><dt class="font-extrabold">Total</dt><dd class="text-2xl font-extrabold tracking-[-0.03em]">' +
            gbp(t.total) +
            "</dd></div></dl>" +
            '<p class="mt-1 text-[12px] text-(--iu-muted)">VAT included · 30-day free returns</p>' +
            '<button type="button" data-checkout class="' +
            PRIMARY +
            ' mt-4 inline-grid w-full"' +
            (placing ? " disabled" : "") +
            ">" +
            '<span class="col-start-1 row-start-1' +
            (placing ? " invisible" : "") +
            '">Checkout · ' +
            gbp(t.total) +
            "</span>" +
            '<span aria-hidden="' +
            !placing +
            '" class="col-start-1 row-start-1 inline-flex items-center justify-center gap-1' +
            (placing ? "" : " invisible") +
            '">Placing order</span></button></div>';

          body.querySelectorAll("[data-minus]").forEach(function (b) {
            b.addEventListener("click", function () {
              setQty(Number(b.getAttribute("data-minus")), -1);
            });
          });
          body.querySelectorAll("[data-plus]").forEach(function (b) {
            b.addEventListener("click", function () {
              setQty(Number(b.getAttribute("data-plus")), 1);
            });
          });
          body.querySelectorAll("[data-remove]").forEach(function (b) {
            b.addEventListener("click", function () {
              setQty(Number(b.getAttribute("data-remove")), -999);
            });
          });
          var removeCode = body.querySelector("[data-code-remove]");
          if (removeCode)
            removeCode.addEventListener("click", function () {
              announce(code + " removed.");
              code = null;
              renderCart();
              body.querySelector("#sock-code").focus();
            });
          var form = body.querySelector("[data-code-form]");
          if (form)
            form.addEventListener("submit", function (event) {
              event.preventDefault();
              var value = body.querySelector("#sock-code").value.trim().toUpperCase();
              if (!value) codeError = "Type a code first.";
              else if (value === "WINTER10") codeError = value + " ended on 31 Jan.";
              else if (value !== "SOCKPOP15")
                codeError = "We don’t recognise “" + value + "”. Codes are on your receipt email.";
              else {
                code = value;
                codeError = "";
                announce(value + " applied: 15% off.");
              }
              renderCart();
              var again = body.querySelector("#sock-code") || body.querySelector("[data-code-remove]");
              if (again) again.focus();
            });
          body.querySelector("[data-checkout]").addEventListener("click", function () {
            placing = true;
            renderCart();
            setTimeout(function () {
              placing = false;
              placed = true;
              cart = [];
              code = null;
              bumpBadge();
              refreshCards();
              renderCart();
              announce("Order SP-20418 placed.");
              root.querySelector("[data-close]").focus();
            }, 1200);
          });
        }

        function setQty(index, delta) {
          var line = cart[index];
          var p = product(line.productId);
          var next = Math.min(line.qty + delta, p.stock[line.size]);
          if (next <= 0) {
            cart.splice(index, 1);
            announce(p.name + " removed from your cart.");
          } else {
            line.qty = next;
            announce(p.name + " quantity " + next + ".");
          }
          bumpBadge();
          refreshCards();
          renderCart();
          var focusTarget = root.querySelector(
            next <= 0 ? "[data-close]" : delta > 0 ? '[data-plus="' + index + '"]' : '[data-minus="' + index + '"]',
          );
          if (focusTarget && !focusTarget.disabled) focusTarget.focus();
          else root.querySelector("[data-close]").focus();
        }

        /* ---------------- drawer */
        function openCart() {
          layer.hidden = false;
          page.inert = true;
          document.body.style.overflow = "hidden";
          renderCart();
          if (!reduce)
            drawer.animate(
              [{ transform: window.innerWidth < 640 ? "translateY(100%)" : "translateX(110%)" }, { transform: "none" }],
              { duration: 320, easing: "cubic-bezier(0.2,0.9,0.2,1)" },
            );
          requestAnimationFrame(function () {
            root.querySelector("[data-close]").focus();
          });
        }
        function close() {
          if (placing || layer.hidden) return;
          layer.hidden = true;
          page.inert = false;
          document.body.style.overflow = "";
          if (placed) placed = false;
          requestAnimationFrame(function () {
            cartButton.focus();
          });
        }
        cartButton.addEventListener("click", openCart);
        root.querySelector("[data-close]").addEventListener("click", close);
        root.querySelector("[data-scrim]").addEventListener("click", close);
        document.addEventListener("keydown", function (event) {
          if (layer.hidden) return;
          if (event.key === "Escape") {
            event.preventDefault();
            close();
            return;
          }
          if (event.key !== "Tab") return;
          var nodes = drawer.querySelectorAll(FOCUSABLE);
          var first = nodes[0],
            last = nodes[nodes.length - 1];
          var current = document.activeElement;
          if (!drawer.contains(current)) {
            event.preventDefault();
            (event.shiftKey ? last : first).focus();
          } else if (event.shiftKey && current === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && current === last) {
            event.preventDefault();
            first.focus();
          }
        });

        renderCart();
        document.body.style.overflow = "hidden";
      })();
    </script>
  </body>
</html>
