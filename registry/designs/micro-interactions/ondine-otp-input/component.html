    <script>
      (function () {
        var root = document.querySelector("[data-otp]");
        if (!root) return;
        var inputs = Array.prototype.slice.call(root.querySelectorAll("[data-slot] input"));
        var row = root.querySelector("[data-row]");
        var joined = root.querySelector("[data-joined]");
        var resendButton = root.querySelector("[data-resend]");
        var announcer = root.querySelector("[data-announce]");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
        var LENGTH = inputs.length;
        var RESEND_SECONDS = 45;
        var DESTINATION = "+44 ••••• ••0821";

        var digits = inputs.map(function () {
          return "";
        });
        var status = "idle";
        var focused = -1;
        var remaining = RESEND_SECONDS;

        function announce(text) {
          announcer.textContent = text;
        }
        function buzz(pattern) {
          if (typeof navigator.vibrate === "function") navigator.vibrate(pattern);
        }
        function locked() {
          return status === "verifying" || status === "success";
        }

        function paint() {
          inputs.forEach(function (input, index) {
            var slot = input.parentElement;
            var digit = digits[index];
            var shown = slot.querySelector("[data-digit]");
            if (shown.textContent !== digit) {
              shown.textContent = digit;
              if (digit && !reduce.matches && shown.animate) {
                shown.animate(
                  [
                    { opacity: 0, transform: "translateY(6px) scale(0.98)" },
                    { opacity: 1, transform: "none" },
                  ],
                  { duration: 320, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" },
                );
              }
            }
            input.value = digit;
            var active = focused === index && !locked();
            slot.querySelector("[data-caret]").hidden = !(active && !digit);
            var line = slot.querySelector("[data-line]");
            line.toggleAttribute("data-active", active && status !== "error");
            line.toggleAttribute("data-error", status === "error");
            line.toggleAttribute("data-filled", Boolean(digit) && !active && status !== "error");
            line.style.transform = "scaleX(" + (status === "success" ? 0 : active ? 1 : 0.86) + ")";
            input.readOnly = locked();
            if (status === "error") input.setAttribute("aria-invalid", "true");
            else input.removeAttribute("aria-invalid");
          });
          joined.style.transform = "scaleX(" + (status === "success" ? 1 : 0) + ")";
          root.querySelectorAll("[data-state]").forEach(function (el) {
            el.hidden = el.getAttribute("data-state") !== status;
          });
          var count = digits.filter(Boolean).length;
          root.querySelector("[data-progress]").textContent = String(count);
          root.querySelector('[data-state="idle"]').style.visibility = count === LENGTH ? "hidden" : "";
        }

        function focusAt(index) {
          var input = inputs[Math.max(0, Math.min(LENGTH - 1, index))];
          input.focus();
          input.select();
        }

        // Demo backend: 481902 is the code that was sent.
        function verify(code) {
          status = "verifying";
          paint();
          announce("Code " + code.split("").join(" ") + " entered. Verifying.");
          setTimeout(function () {
            if (code === "481902") {
              status = "success";
              paint();
              announce("Verified. Welcome back, Margaux.");
              buzz(16);
              resendButton.disabled = true;
              return;
            }
            status = "error";
            digits = digits.map(function () {
              return "";
            });
            paint();
            announce("That code doesn't match. Check the latest message and try again.");
            buzz([10, 60, 10]);
            if (!reduce.matches && row.animate) {
              row.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(0)" }], {
                duration: 420,
                easing: "cubic-bezier(0.2, 0.8, 0.2, 1)",
              });
            }
            focusAt(0);
          }, 900);
        }

        function fill(index, text) {
          var chars = text.replace(/\D/g, "").split("");
          if (!chars.length) return;
          var start = chars.length >= LENGTH ? 0 : index;
          chars.slice(0, LENGTH - start).forEach(function (char, offset) {
            digits[start + offset] = char;
          });
          if (status === "error") status = "idle";
          paint();
          if (digits.every(Boolean)) {
            verify(digits.join(""));
            return;
          }
          var empty = -1;
          for (var i = start; i < LENGTH; i++) {
            if (!digits[i]) {
              empty = i;
              break;
            }
          }
          focusAt(empty === -1 ? start + chars.length : empty);
        }

        function clearAt(index) {
          digits[index] = "";
          paint();
        }

        inputs.forEach(function (input, index) {
          input.addEventListener("focus", function () {
            focused = index;
            input.select();
            paint();
          });
          input.addEventListener("blur", function () {
            focused = -1;
            paint();
          });
          input.addEventListener("input", function () {
            if (locked()) return;
            var value = input.value;
            var cleaned = value.replace(/\D/g, "");
            if (!value) return clearAt(index);
            if (!cleaned) {
              input.value = digits[index];
              return;
            }
            var current = digits[index];
            var typed =
              cleaned.length === 2 && current && cleaned.indexOf(current) !== -1
                ? cleaned.replace(current, "")
                : cleaned;
            fill(index, typed || cleaned.slice(-1));
          });
          input.addEventListener("paste", function (event) {
            event.preventDefault();
            if (locked()) return;
            fill(index, (event.clipboardData || window.clipboardData).getData("text"));
          });
          input.addEventListener("keydown", function (event) {
            if (locked()) return;
            var key = event.key;
            if (key === "Backspace") {
              event.preventDefault();
              if (digits[index]) clearAt(index);
              else if (index > 0) {
                clearAt(index - 1);
                focusAt(index - 1);
              }
            } else if (key === "Delete") {
              event.preventDefault();
              clearAt(index);
            } else if (key === "ArrowLeft") {
              event.preventDefault();
              focusAt(index - 1);
            } else if (key === "ArrowRight") {
              event.preventDefault();
              focusAt(index + 1);
            } else if (key === "Home") {
              event.preventDefault();
              focusAt(0);
            } else if (key === "End") {
              event.preventDefault();
              focusAt(LENGTH - 1);
            }
          });
        });

        function clock(seconds) {
          return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
        }
        function tick() {
          if (status === "success") return;
          if (remaining > 0) {
            remaining -= 1;
            root.querySelector("[data-clock]").textContent = clock(remaining);
            setTimeout(tick, 1000);
          } else {
            resendButton.disabled = false;
            resendButton.textContent = "Send a new code";
          }
        }
        setTimeout(tick, 1000);

        resendButton.addEventListener("click", function () {
          if (remaining > 0) return;
          remaining = RESEND_SECONDS;
          resendButton.disabled = true;
          resendButton.innerHTML = 'Resend in <span data-clock class="tabular-nums">' + clock(remaining) + "</span>";
          digits = digits.map(function () {
            return "";
          });
          status = "idle";
          paint();
          announce("A new code is on its way to " + DESTINATION + ".");
          focusAt(0);
          setTimeout(tick, 1000);
        });

        paint();
      })();
    </script>
