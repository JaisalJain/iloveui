          trigger.setAttribute("aria-controls", menu.id);
          trigger.querySelector("svg").classList.add("rotate-180");
          if (!reduce)
            menu.animate(
              [
                { opacity: 0, transform: "translateY(-4px) scale(0.98)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 160, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" },
            );
          var list = items();
          (which === "last" ? list[list.length - 1] : list[0]).focus();
          menu.addEventListener("keydown", onMenuKey);
          menu.addEventListener("click", function (event) {
            var item = event.target.closest("[data-item]");
            if (!item) return;
            var id = item.getAttribute("data-item");
            closeMenu(true);
            if (id === "rollback") announce("Rolling back to v214");
            else deploy(id);
          });
        }
        function closeMenu(returnFocus) {
          if (!menu) return;
          menu.remove();
          menu = null;
          trigger.setAttribute("aria-expanded", "false");
          trigger.querySelector("svg").classList.remove("rotate-180");
          if (returnFocus) trigger.focus();
        }
        function onMenuKey(event) {
          var list = items();
          var index = list.indexOf(document.activeElement);
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault();
            list[(index + (event.key === "ArrowDown" ? 1 : -1) + list.length) % list.length].focus();
          } else if (event.key === "Home" || event.key === "End") {
            event.preventDefault();
            (event.key === "Home" ? list[0] : list[list.length - 1]).focus();
          } else if (event.key === "Escape") {
            event.preventDefault();
            closeMenu(true);
          } else if (event.key === "Tab") closeMenu(false);
        }
        trigger.addEventListener("click", function () {
          if (menu) closeMenu(false);
          else openMenu("first");
        });
        trigger.addEventListener("keydown", function (event) {
          if (event.key === "ArrowDown" || event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openMenu("first");
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            openMenu("last");
          }
        });
        document.addEventListener("pointerdown", function (event) {
          if (menu && !menu.contains(event.target) && !trigger.contains(event.target)) closeMenu(false);
        });

        // Shortcuts.
        window.addEventListener("keydown", function (event) {
          if (event.target.closest && event.target.closest("input, textarea, select, [contenteditable='true']")) return;
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            deploy("production");
          } else if (event.key === "Enter" && event.altKey) {
            event.preventDefault();
            deploy("preview");
          } else if (!event.metaKey && !event.ctrlKey && !event.altKey && (event.key === "c" || event.key === "C")) {
            copyUrl();
          } else if (!event.metaKey && !event.ctrlKey && !event.altKey && (event.key === "r" || event.key === "R")) {
            announce("Redeploying atlas-web");
          }
        });
      })();
    </script>
  </body>
</html>
