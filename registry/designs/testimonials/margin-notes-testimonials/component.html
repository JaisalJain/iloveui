    <script>
      (function () {
        var root = document.querySelector("[data-margin-notes]");
        if (!root) return;
        var tablist = root.querySelector('[role="tablist"]');
        var tabs = Array.prototype.slice.call(root.querySelectorAll('[role="tab"]'));
        var panels = Array.prototype.slice.call(root.querySelectorAll('[role="tabpanel"]'));
        var digits = Array.prototype.slice.call(root.querySelectorAll("[data-digit]"));
        // Motion lives in CSS: each word reads its timing from its panel's data-state, and the motion-reduce
        // classes make every change instant. The script only switches states.
        var WORD_CLASS =
          "inline-block translate-y-(--mn-shift) opacity-(--mn-opacity) transition-[opacity,translate] duration-(--mn-duration) delay-[calc(var(--mn-delay)+var(--line,0)*var(--mn-stagger))] ease-(--mn-ease) motion-reduce:transition-none";
        var active = 0;
        var previous = -1;

        // Wrap every word of each quote in a span, so a rendered line can leave and arrive as one.
        panels.forEach(function (panel) {
          var quote = panel.querySelector("[data-quote]");
          var words = quote.textContent.trim().split(/\s+/);
          quote.textContent = "";
          words.forEach(function (word, index) {
            var span = document.createElement("span");
            span.setAttribute("data-word", "");
            span.className = WORD_CLASS;
            span.textContent = word;
            quote.appendChild(span);
            if (index < words.length - 1) quote.appendChild(document.createTextNode(" "));
          });
        });

        // Groups a panel's words into rendered lines; words on one line share a transition delay.
        function measureLines(index) {
          var panel = panels[index];
          if (!panel) return;
          var line = -1;
          var top = -Infinity;
          panel.querySelectorAll("[data-word]").forEach(function (word) {
            if (word.offsetTop > top + 2) {
              line += 1;
              top = word.offsetTop;
            }
            word.style.setProperty("--line", String(line));
          });
          panel.style.setProperty("--lines", String(line + 1));
          var byline = panel.querySelector("[data-byline]");
          // The byline arrives with the first line, so the reader knows who is speaking as soon as the quote starts.
          if (byline) byline.style.setProperty("--line", "0");
        }

        function render() {
          tabs.forEach(function (tab, index) {
            var selected = index === active;
            tab.setAttribute("aria-selected", selected ? "true" : "false");
            tab.tabIndex = selected ? 0 : -1;
          });
          panels.forEach(function (panel, index) {
            var state = index === active ? "active" : index === previous ? "leaving" : "waiting";
            panel.setAttribute("data-state", state);
            if (state === "active") {
              panel.removeAttribute("aria-hidden");
              panel.tabIndex = 0;
            } else {
              panel.setAttribute("aria-hidden", "true");
              panel.removeAttribute("tabindex");
            }
          });
          var number = String(active + 1).padStart(digits.length, "0");
          digits.forEach(function (column, index) {
            column.style.transform = "translateY(-" + Number(number.charAt(index)) * 10 + "%)";
          });
        }

        function select(index) {
          if (index === active) return;
          measureLines(active);
          measureLines(index);
          // A note that has fully left rests above its slot (so an exit still running is never cut short). Move
          // it below without a transition first, so its lines rise into place.
          // A note re-selected mid-exit reverses from where its lines are instead.
          var incoming = panels[index];
          var parts = Array.prototype.slice.call(incoming.querySelectorAll("[data-word], [data-byline]"));
          var gone = parts.every(function (part) {
            return getComputedStyle(part).opacity === "0";
          });
          if (parts.length > 0 && gone) {
            incoming.setAttribute("data-state", "ready");
            incoming.getBoundingClientRect();
          }
          previous = active;
          active = index;
          render();
          // In the narrow layout the row of names can scroll; keep the chosen one fully in view.
          tabs[index].scrollIntoView({ block: "nearest", inline: "nearest" });
          // The counterpart of onSelectedChange in the React version.
          root.dispatchEvent(
            new CustomEvent("margin-notes:change", {
              detail: { index: index, id: panels[index].getAttribute("data-note") },
            }),
          );
        }

        tabs.forEach(function (tab, index) {
          tab.addEventListener("click", function () {
            select(index);
          });
          tab.addEventListener("keydown", function (event) {
            var last = tabs.length - 1;
            // Only the arrows along the index move the selection, so the others keep scrolling the page.
            var vertical = tablist.getAttribute("aria-orientation") === "vertical";
            var next = null;
            if (event.key === (vertical ? "ArrowDown" : "ArrowRight")) next = index === last ? 0 : index + 1;
            else if (event.key === (vertical ? "ArrowUp" : "ArrowLeft")) next = index === 0 ? last : index - 1;
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = last;
            if (next === null) return;
            event.preventDefault();
            select(next);
            tabs[next].focus();
          });
        });

        // The index is a vertical list beside the quote, and a row of names above it in narrow containers. In the row,
        // edges that hide names fade out.
        function updateLayout() {
          var vertical = getComputedStyle(tablist).flexDirection === "column";
          tablist.setAttribute("aria-orientation", vertical ? "vertical" : "horizontal");
          var before = !vertical && tablist.scrollLeft > 1;
          var after = !vertical && tablist.scrollLeft + tablist.clientWidth < tablist.scrollWidth - 1;
          tablist.setAttribute("data-overflow", before && after ? "both" : before ? "start" : after ? "end" : "none");
        }
        updateLayout();
        tablist.addEventListener("scroll", updateLayout, { passive: true });
        if ("ResizeObserver" in window) {
          var observer = new ResizeObserver(updateLayout);
          observer.observe(tablist);
          tabs.forEach(function (tab) {
            observer.observe(tab);
          });
        }
      })();
